# cargo-deny: licences, advisories and duplicate crates.

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2025-0141: bincode 1.x is unmaintained. It is not a vulnerability —
# no advisory claims a defect — and nothing here calls it: syntect uses it to
# load the compiled syntax definitions it ships with, and those bytes are built
# into the binary rather than read from anywhere a user or a model can reach.
# There is no syntect configuration that keeps the bundled syntaxes without it,
# and the alternatives are a C-compiled highlighter, which the Windows install
# promise rules out, or no highlighting.
#
# Revisit when: syntect releases against bincode 2, or the advisory becomes a
# vulnerability rather than a maintenance notice. Anything that makes these
# bytes attacker-controlled — loading syntax dumps from disk, say — retires the
# exception rather than widening it.
ignore = ["RUSTSEC-2025-0141"]

[licenses]
version = 2
# Permissive only. A copyleft dependency in a tool people `cargo install` is a
# decision, not an accident — so it fails here and gets made deliberately.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A wildcard silently accepts a future breaking release. Workspace path
# dependencies carry an explicit version for the same reason, so this needs no
# exemption.
wildcards = "deny"
# One TLS stack. Two means one of them is not the one we configured.
deny = [
    { name = "openssl-sys" },
    { name = "native-tls" },
    # rustls' and reqwest's default crypto provider. It vendors AWS-LC as C and
    # assembly, so it wants CMake everywhere and NASM on Windows — the two tools
    # a clean Windows install is promised not to need. It is kept out by
    # `default-features = false` on both, which is exactly the kind of thing a
    # future dependency undoes by accident: feature unification means one crate
    # asking for the defaults re-enables them for everyone, and nothing in the
    # build would say so.
    { name = "aws-lc-sys" },
    { name = "aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
