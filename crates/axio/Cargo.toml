[package]
name = "axio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A coding agent for the terminal."

[[bin]]
name = "axio"
path = "src/main.rs"

[features]
default = ["tui"]
# ratatui and crossterm link into every install unless this is turned off. CI
# builds --no-default-features so the headless path cannot rot.
tui = ["dep:ratatui", "dep:crossterm", "dep:syntect", "dep:two-face"]

[dependencies]
axio-core.workspace = true
axio-provider.workspace = true
axio-quota.workspace = true
axio-tools.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
etcetera.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }
syntect = { workspace = true, optional = true }
two-face = { workspace = true, optional = true }
# The interactive surface selects on key input alongside the agent's events, so
# it needs the same Stream trait the provider uses, and the same async-trait
# shim the Approver trait is declared with.
async-trait.workspace = true
futures-core.workspace = true
tokio-util.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[dev-dependencies]
axio-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
