[package]
name = "axio-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The six tools axio ships. The only crate that walks a filesystem or spawns a subprocess."

[dependencies]
axio-core.workspace = true
async-trait.workspace = true
globset.workspace = true
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
similar.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "process", "time", "io-util", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
async-trait.workspace = true
axio-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
