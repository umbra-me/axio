[package]
name = "axio-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Provider transport for axio: the Anthropic Messages API over a hand-written SSE decoder."

[dependencies]
axio-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures-core.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `net` and `io-util` are the OAuth callback listener: the browser redirects to
# a port on the loopback, so this crate has to accept one connection and answer
# it. Everything else here is a client.
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util"] }
ring.workspace = true
base64.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
axio-core = { workspace = true, features = ["testing"] }
insta.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
