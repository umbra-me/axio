[package]
name = "axio-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Many agent sessions at once, across many repositories, each isolated in its own git worktree."

[dependencies]
axio-core.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `process` for git, which is spawned by this crate and never by a tool. There is
# deliberately no libgit2: it compiles C, and `cargo install axio` is promised to
# need no C toolchain — the same reason `deny.toml` refuses aws-lc-sys.
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
axio-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
