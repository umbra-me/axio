    <!--
      THESIS: the chrome is glass and the content is slate. It refuses the
      near-black-panel-on-near-black-panel arrangement every agent tool ships,
      where nothing is translucent and nothing is legible.
      OWN-WORLD: compositor acrylic tinted dark at the OS level; chrome at
      0.56-0.66 alpha over it; content at 0.84 and terminals at 0.93. One 4px
      spacing rhythm, six type steps from 11px to 30px, drawn 16-unit icons at
      1.5 stroke, and per-agent accent that only ever colours agent-owned rows.
      STORY: a supervisor sees which agents are running, on which repositories,
      and what each one changed — then answers the ones that are waiting.
      FIRST VIEWPORT: rail of repositories and their sessions at 300px, a
      breadcrumb toolbar, and the pane. With nothing selected the pane states
      what the product is at 30px and hands over the two ways to start.
      FORM: desktop shell, user-pinned direction (true glass), no roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
