[package]
name = "axio-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The axio desktop surface: many agent sessions at once, across many repositories."

[lib]
# Named apart from the binary: both targets otherwise emit `axio_app.pdb` and
# cargo warns about the collision on every Windows build.
name = "axio_app_lib"
# `staticlib` and `cdylib` are what a Tauri mobile target links; `rlib` is what
# the binary beside this uses. Naming all three now costs nothing and avoids a
# manifest change later.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "axio-app"
path = "src/bin/axio-app.rs"
required-features = ["app"]

[features]
default = []
# The desktop shell. Off by default for the same reason `axio-quota`'s is:
# Tauri carries a webview runtime and a build script, and `cargo test
# --workspace` should not compile either to run a unit test. Everything that
# holds state is outside this feature and testable without it.
app = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:axio"]

[dependencies]
axio-core.workspace = true
axio-supervisor.workspace = true
axio-pty.workspace = true
# The wiring, not a second copy of it. `default-features = false` drops the
# terminal interface — the app needs `LocalFactory`, which is how a session gets
# a provider, the tools, the policy and the protected directories, and it must
# be the *same* one the CLI uses or the two surfaces diverge on the first
# permission rule somebody changes.
axio = { path = "../axio", version = "0.1.0", default-features = false, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# Generates the TypeScript for every shape that crosses into the webview.
# Hand-mirroring that boundary is how the two sides drift, and the prior art
# this design is drawn from warns about exactly that in four separate documents
# and then drifted anyway. A derive and a test beat a warning.
ts-rs = "12.0.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tauri = { workspace = true, optional = true }
tauri-plugin-dialog = { version = "2.7.2", optional = true }

[build-dependencies]
tauri-build = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
