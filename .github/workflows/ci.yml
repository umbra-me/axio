name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Cheap, OS-independent gates. Run first so a naming or budget violation
  # fails in seconds rather than after three build matrices.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Naming firewall
        run: bash scripts/firewall.sh
      - name: Structural limits
        run: bash scripts/limits.sh
      - name: Formatting
        run: cargo fmt --all -- --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Headless build
        run: cargo build -p axio --no-default-features
      - name: Core dependency isolation
        if: runner.os == 'Linux'
        run: bash scripts/deps.sh
      - name: Windows cross-check
        if: runner.os == 'Linux'
        run: bash scripts/check-windows.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
