name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Cheap, OS-independent gates. Run first so a naming or budget violation
  # fails in seconds rather than after three build matrices.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Naming firewall
        run: bash scripts/firewall.sh
      - name: Structural limits
        run: bash scripts/limits.sh
      - name: Formatting
        run: cargo fmt --all -- --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Feature combinations
        run: bash scripts/features.sh
      - name: Core dependency isolation
        if: runner.os == 'Linux'
        run: bash scripts/deps.sh
      - name: Windows cross-check
        if: runner.os == 'Linux'
        run: bash scripts/check-windows.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix crates/axio-app/ui
      - run: npm ci --prefix crates/axio-quota/ui
      - run: cargo test --locked -p axio-app
      - run: git diff --exit-code -- crates/axio-app/ui/src/generated
      - run: npm --prefix crates/axio-app/ui run build
      - run: npm --prefix crates/axio-quota/ui run build
      - run: cargo check --locked -p axio-app --features app
      - if: runner.os == 'Windows'
        run: cargo check --locked -p axio-quota --features app
