name: release

# Pushing a tag vX.Y.Z builds each platform's binary and publishes a GitHub
# release with SHA256SUMS and the CHANGELOG section for X.Y.Z. `axio update`
# reads these asset names, so keep them in step with src/update.rs.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: rustup toolchain install && rustup target add "$TARGET"
        shell: bash
      - run: cargo build --release --locked --target "$TARGET"
        shell: bash
      - name: Name the binary for the release
        shell: bash
        run: |
          mkdir dist
          ext=""; case "$TARGET" in *windows*) ext=.exe;; esac
          cp "target/$TARGET/release/axio$ext" "dist/axio-$TARGET$ext"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axio-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: axio-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh scripts/release-notes.sh "$version" > notes.md
          (cd dist && sha256sum axio-* > SHA256SUMS && cat SHA256SUMS)
          pre=""; case "$version" in *-*) pre=--prerelease;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "axio $version" --notes-file notes.md --verify-tag $pre
