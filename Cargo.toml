[workspace]
resolver = "3"
members = [
    "crates/axio-core",
    "crates/axio-cost",
    "crates/axio-provider",
    "crates/axio-quota",
    "crates/axio-tools",
    "crates/axio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/umbra-me/axio"
homepage = "https://github.com/umbra-me/axio"
readme = "README.md"
keywords = ["agent", "llm", "cli", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Versioned, not bare paths. A path dependency with no version cannot be
# published, and cargo-deny reads it as a wildcard — which is the same hazard
# it is for a registry dependency, just harder to see.
axio-core = { path = "crates/axio-core", version = "0.1.0" }
axio-cost = { path = "crates/axio-cost", version = "0.1.0" }
axio-provider = { path = "crates/axio-provider", version = "0.1.0" }
axio-quota = { path = "crates/axio-quota", version = "0.1.0" }
axio-tools = { path = "crates/axio-tools", version = "0.1.0" }

anyhow = "1.0.104"
async-trait = "0.1.91"
bytes = "1.12.1"
futures-core = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.19"
# Already resolved in the lockfile behind the `tui` feature (ratatui-widgets pulls it), so
# `axio-quota` naming it adds no lockfile entry — only the parsing and formatting features.
# Preferred over chrono for exactly that reason.
time = { version = "0.3.54", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
toml = "1.1.3"
tracing = "0.1.44"
# Already resolved in the lockfile, so the tray costs no new package. Only the modules
# the notification-area surface actually calls are enabled.
# The desktop app: tray, HTML flyout and window, all one Tauri process. Behind the `app`
# feature so a default `cargo install axio` links none of it. The frontend is React and
# TypeScript, matching apps/site, built by Vite rather than Next — a desktop app has no
# server to render on.
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = { version = "2.6.3" }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
ulid = { version = "3.0.0", features = ["serde"] }

# rustls WITHOUT a crypto provider, so we install `ring` ourselves. The default
# provider is aws-lc-rs, whose -sys crate needs CMake and NASM on Windows
# x86-64 — a `cargo install` failure on the platform we can least afford it on.
# `json` and `stream` are not default features in reqwest 0.13 and must be named.
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "http2",
    "charset",
    "system-proxy",
    "json",
    "stream",
] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
# Already in the tree as rustls' crypto provider, named here so the OAuth flow
# can use the SHA-256 and the CSPRNG it already ships rather than pulling a
# second implementation of either. Nothing new enters the build by naming it.
ring = "0.17.14"
# base64url for the PKCE challenge. Also already in the tree; hand-rolling the
# alphabet is twenty lines nobody should have to review.
base64 = "0.22.1"

clap = { version = "4.6.2", default-features = false, features = ["std", "help", "usage", "error-context"] }
# The interactive surface. Behind the `tui` feature so the headless build links
# neither of them; `event-stream` is what lets key input be selected on
# alongside the agent's events instead of polled from a second thread.
# `scrolling-regions` is not a nicety: without it every `insert_before` asks the
# terminal where the cursor is, and the reply is read from stdin — which the key
# handler is already reading. The two race, the reply is eaten, and the
# interface dies with "the cursor position could not be read". With it, the
# insert uses a scrolling region and asks nothing.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "scrolling-regions"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
# Syntax highlighting for fenced code, behind the `tui` feature with the rest of
# the interface. `regex-fancy` rather than the default `regex-onig`: oniguruma
# is a C library, and a C toolchain is exactly what installing on a clean
# Windows machine is promised not to need. Only the parser is taken — colours
# come from the terminal's own palette rather than a bundled theme, so
# highlighted code matches the terminal it is printed into.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
etcetera = "0.11.0"
# Linux-only, and only in the binary. A safe wrapper over the kernel's own
# unprivileged sandbox — no container runtime, no setuid helper, nothing to
# install.
landlock = "0.4.6"
globset = "0.4.19"
ignore = "0.4.31"
shlex = "2.0.1"
similar = "3.1.1"
which = "8.0.5"

insta = { version = "1.48.0", features = ["json"] }
tempfile = "3.27.0"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
