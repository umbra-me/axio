[workspace]
resolver = "3"
members = [
    "crates/axio-core",
    "crates/axio-provider",
    "crates/axio-tools",
    "crates/axio",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/umbra-me/axio"

[workspace.dependencies]
axio-core = { path = "crates/axio-core" }
axio-provider = { path = "crates/axio-provider" }
axio-tools = { path = "crates/axio-tools" }

anyhow = "1.0.104"
async-trait = "0.1.91"
bytes = "1.12.1"
futures-core = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
toml = "1.1.3"
tracing = "0.1.44"
ulid = { version = "3.0.0", features = ["serde"] }

# rustls WITHOUT a crypto provider, so we install `ring` ourselves. The default
# provider is aws-lc-rs, whose -sys crate needs CMake and NASM on Windows
# x86-64 — a `cargo install` failure on the platform we can least afford it on.
# `json` and `stream` are not default features in reqwest 0.13 and must be named.
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls-no-provider",
    "http2",
    "charset",
    "system-proxy",
    "json",
    "stream",
] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }

clap = { version = "4.6.2", default-features = false, features = ["std", "help", "usage", "error-context"] }
insta = { version = "1.48.0", features = ["json"] }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
